name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish target'
        type: choice
        options:
          - jsr
          - npm
          - both
        default: both

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    uses: ./.github/workflows/check.yml

  test:
    uses: ./.github/workflows/test.yml

  publish-jsr:
    needs: [check, test]
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'jsr' || inputs.target == 'both'))
    runs-on: [self-hosted, aur0]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Publish to JSR
        run: deno publish

  publish-npm:
    needs: [check, test]
    if: |
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'npm' || inputs.target == 'both'))
    runs-on: [self-hosted, aur0]
    # Always the `publish` environment. NPM_TOKEN lives there and nowhere
    # else -- there is no repo- or org-level fallback -- so a run without
    # it publishes with an empty NODE_AUTH_TOKEN and fails on auth.
    environment: publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Build npm package
        run: deno task build:npm
      - name: Publish to npm
        working-directory: ./npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
