name: Nightly

on:
  schedule:
    # Daily Ubuntu sanity + integration run at 03:00 UTC.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Unit + type checks on Ubuntu across the Deno matrix. Runs on the
  # daily cron, workflow_dispatch, and the weekly cron (so manual runs
  # always exercise Ubuntu too).
  sanity:
    name: Sanity (${{ matrix.os }} / Deno ${{ matrix.deno }})
    if: github.event_name != 'schedule' || github.event.schedule == '0 3 * * *'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        deno: [v2.x, canary]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno }}

      - name: Check formatting
        run: deno fmt --check

      - name: Check lint
        run: deno lint

      - name: Type check
        run: deno check mod.ts

      - name: Run unit tests
        run: |
          deno test -A \
            --ignore="src/test/auth.test.ts,src/test/integration.test.ts,src/test/integration_crud.test.ts,src/test/integration_client.test.ts" \
            -q

  # macOS sanity runs on a weekly cadence (Sundays 06:00 UTC) or via
  # manual workflow_dispatch. Kept separate from the daily ubuntu job
  # because macOS runners bill at 10x Linux.
  # Integration tests against both the pinned v3 image and `latest`.
  # Ubuntu only because GitHub-hosted macOS runners lack Docker.
  # Runs daily (and on workflow_dispatch); skipped on the weekly macOS cron.
  integration:
    name: Integration (Deno ${{ matrix.deno }} / surrealdb:${{ matrix.surreal }})
    if: github.event_name != 'schedule' || github.event.schedule == '0 3 * * *'
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      matrix:
        deno: [v2.x, canary]
        surreal: ['v3.0.5', 'latest']
    steps:
      - uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno }}

      - name: Start SurrealDB (${{ matrix.surreal }})
        run: |
          docker run -d \
            --name surrealdb \
            -p 8000:8000 \
            surrealdb/surrealdb:${{ matrix.surreal }} \
            start --user root --pass root memory
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then
              echo "SurrealDB is ready"
              break
            fi
            echo "Waiting for SurrealDB... attempt $i"
            sleep 2
          done

      - name: Run deno task test
        run: deno task test
