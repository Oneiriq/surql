name: Security Audit

# Deno / JSR does not yet ship a first-party `deno audit` comparable to
# `cargo audit` or `govulncheck`. `@oneiriq/surql` is a pure JSR module
# that pulls a handful of npm specifiers (`zod`, `surrealdb`) via
# Deno's `npm:` compatibility layer. To keep parity with surql-rs /
# surql-go / surql-py, we synthesize a package.json listing just the
# npm specifiers from `deno.json` and run `npm audit` against it.
#
# The synthesized manifest is discarded after the run -- no lockfile
# is committed. JSR-only updates are still caught by `nightly.yml` via
# the Deno version matrix.

# Fires on PRs that touch the dependency surface (paths-filtered so unrelated
# PRs don't trigger an audit), on a daily schedule to catch newly-published
# advisories, and on manual dispatch.
on:
  pull_request:
    branches:
      - main
      - 'release/**'
    paths:
      - 'deno.json'
      - 'deno.lock'
      - '.github/workflows/audit.yml'
  schedule:
    # Daily at 04:00 UTC.
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every step here only reads the checkout and runs npm
# against a manifest it synthesizes itself. Without this block the job
# inherits the repository default, which code scanning flags
# (actions/missing-workflow-permissions).
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    name: "npm audit (npm: specifiers from deno.json)"
    # aur0 self-hosted for push/schedule/dispatch + same-repo PRs. Fork PRs
    # fall back to ubuntu-latest — the synthesized `npm install` runs npm
    # against PR-controlled specifiers, so it must never touch aur0.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "aur0"]') }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: "Synthesize package.json from deno.json npm: imports"
        run: |
          node <<'EOF'
          const fs = require('node:fs')
          const deno = JSON.parse(fs.readFileSync('deno.json', 'utf8'))
          const imports = deno.imports ?? {}
          const deps = {}
          for (const [_, spec] of Object.entries(imports)) {
            if (typeof spec !== 'string') continue
            if (!spec.startsWith('npm:')) continue
            // strip "npm:", then split "name@range" honoring scoped packages
            const bare = spec.slice(4)
            const at = bare.lastIndexOf('@')
            if (at <= 0) {
              deps[bare] = '*'
              continue
            }
            const name = bare.slice(0, at)
            const range = bare.slice(at + 1).split('/')[0]
            // keep the tightest pin we saw for a given name
            if (!deps[name] || deps[name] === '*') {
              deps[name] = range
            }
          }
          const pkg = {
            name: 'surql-audit-synth',
            version: '0.0.0',
            private: true,
            dependencies: deps
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2))
          console.log('Synthesized package.json:')
          console.log(JSON.stringify(pkg, null, 2))
          EOF

      - name: Generate lockfile for synthesized package.json
        # `npm audit` requires an existing lockfile (ENOLOCK otherwise).
        # We never commit it -- it lives only for the duration of the job.
        run: npm install --package-lock-only --omit=dev

      - name: Run npm audit
        run: npm audit --audit-level=moderate --omit=dev
