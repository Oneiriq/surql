name: Code Check

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  code_quality:
    runs-on: [self-hosted, Linux, X64]
    strategy:
      matrix:
        deno-version: [v2.x]
    steps:
      - uses: actions/checkout@v5
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno-version }}
      - name: Check formatting
        run: deno fmt --check
      - name: Check Lint
        run: deno lint
      - name: Type check
        run: deno check mod.ts
